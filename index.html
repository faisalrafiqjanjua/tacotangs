<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taco Tang's - Coming Soon</title>
<meta name="description" content="Taco Tang's is coming soon. Tangy Twist In Every Bite.">
<meta property="og:title" content="Taco Tang's - Coming Soon">
<meta property="og:description" content="Tangy Twist In Every Bite">
<style>
  :root { --purple:#3B225B; --gold:#FDD37E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    min-height:100%;
    background: var(--purple);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: 28px 20px;
    text-align:center;
    overflow-x:hidden;
  }
  main { width:100%; max-width:980px; display:flex; flex-direction:column; align-items:center; }
  .top { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:start; gap:6px; }
  .top .pose { width:clamp(70px,21vw,min(230px,31vh)); height:auto; display:block; }
  .top .pose.left { justify-self:start; }
  .top .pose.right { justify-self:end; }
  .logo { width:auto; max-width:min(42vw, 360px); max-height:27vh; height:auto; display:block; }
  .rule { width:64px; height:4px; background:var(--gold); border-radius:4px; margin:clamp(16px,3vh,30px) 0 clamp(12px,2.5vh,22px); }

  h1 {
    color: var(--gold);
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: .14em;
    line-height:1.05;
  }
  .insha { margin-top:10px; font-size:1.05rem; letter-spacing:.06em; opacity:.85; }

  .urdu { margin-top:18px; font-size:1.2rem; line-height:1.9; max-width:30ch; direction: rtl; text-wrap: balance; }
  .tagline {
    margin-top:22px;
    font-size:.95rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color: var(--gold);
    border-top:1px solid rgba(253,211,126,.45);
    padding-top:16px;
  }
  .links { margin-top:20px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .links a {
    color: var(--purple); background: var(--gold);
    text-decoration:none;
    padding:12px; border-radius:50%; width:48px; height:48px;
    display:inline-flex; align-items:center;
    justify-content:center;
  }
  .links a svg { width:24px; height:24px; fill:currentColor; }
  .links a:hover, .links a:focus-visible { outline:3px solid #fff; outline-offset:2px; }


  @media (max-width: 599px) {
    /* phone: character on top, logo centred below */
    .top { grid-template-columns:1fr; justify-items:center; gap:4px; }
    .top .pose.right { display:none; }
    .top .pose.left { justify-self:center; width:min(52vw,210px); order:1; }
    .logo { order:2; width:min(72vw,300px); max-width:none; max-height:none; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <img class="pose left" src="TT_Pose_11_1_WORKING-SOURCE-LOWRES.png" alt="TT Star character welcoming you" width="378" height="414">
    <img class="logo" src="logo_vertical_dark.png" alt="Taco Tang's logo" width="909" height="823">
    <img class="pose right" src="TT_Pose_09_WORKING-SOURCE-LOWRES.png" alt="TT Star character announcing with a megaphone" width="383" height="405">
  </div>
  <div class="rule"></div>
      <h1>COMING SOON</h1>
      <p class="insha">insha'Allah</p>
  <p class="urdu">مزیدار ذائقے بہت جلد آپ کی خدمت میں پیش کیے جا رہے ہیں۔</p>
  <p class="tagline">Tangy Twist In Every Bite</p>
  <nav class="links" aria-label="Social media links">
    <a href="https://www.instagram.com/tacotangs/" target="_blank" rel="noopener" aria-label="Instagram @tacotangs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.25"/></svg>
    </a>
    <a href="https://www.facebook.com/share/19MQFPeSfC/" target="_blank" rel="noopener" aria-label="Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.3v3h2.8v8h3.4z"/></svg>
    </a>
    <a href="https://www.tiktok.com/@tacotangs" target="_blank" rel="noopener" aria-label="TikTok @tacotangs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 3c.3 2.2 1.6 3.5 3.8 3.7v3.2a8.6 8.6 0 0 1-3.8-1.1v6.8a5.4 5.4 0 1 1-5.4-5.4c.4 0 .8 0 1.2.1v3.4a2.1 2.1 0 1 0 1 1.8V3h3.2z"/></svg>
    </a>
  </nav>
</main>
</body>
</html>
