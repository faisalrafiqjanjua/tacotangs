<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Tang's - Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #2b1140; /* Purplish Brand Theme */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #381854;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 2px solid #ffcc00;
        }
        .logo { max-width: 220px; margin-bottom: 20px; }
        .character { max-width: 200px; height: auto; margin: 15px 0; }
        h1 { color: #ffcc00; font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #e0d0f0; font-size: 1.1rem; margin-bottom: 25px; line-height: 1.5; }
        .badge {
            background: #ffcc00;
            color: #2b1140;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- لوگو تصویر -->
        <img src="https://ibb.co/mrDP5vTK" alt="Taco Tang's Logo" class="logo">
        
        <!-- سٹار کریکٹر -->
        <br>
        <img src="https://ibb.co/j9DrMgWC" alt="Taco Tang's Character" class="character">
      
        <h1>WE ARE COMING SOON insha'Allah!</h1>
        <p>مذیدار اور تازہ ترین ذائقے بہت جلد آپ کی خدمت میں پیش کیے جا رہے ہیں۔</p>
        
        <div class="badge">Tacos Made Fresh!</div>
    </div>
</body>
</html>
