<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Tang's - Coming Soon</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body {
            background-color: #312044; /* Brand Dark Purple */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #3B225B; /* Brand Card Purple */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 2px solid #FDD37E; /* Brand Yellow */
        }
        .logo { 
            max-width: 100%; 
            height: auto; 
            margin-bottom: 20px; 
            border-radius: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1 { 
            color: #FDD37E; 
            font-size: 2.2rem; 
            margin-bottom: 10px; 
        }
        p { 
            color: #D0A1FA; 
            font-size: 1.1rem; 
            margin-bottom: 25px; 
            line-height: 1.5; 
        }
        .badge {
            background: #FDD37E; /* Brand Yellow */
            color: #2A2929; /* Brand Charcoal Text */
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- مرکزی تصویر -->
        <img src="main.jpg" alt="Taco Tang's Store" class="logo">

        <h1>WE ARE COMING SOON insha'Allah!</h1>
        <p>مزیدار اور تازہ ترین ذائقے بہت جلد آپ کی خدمت میں پیش کیے جا رہے ہیں۔</p>
        
        <div class="badge">Tangy Twist in Every Bite!</div>
    </div>
</body>
</html>
